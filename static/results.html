<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klarify</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261120b" />
</head>
<body>
  <div id="processingView" class="processing-wrap screen screen-narrow" hidden>
    <div class="processing-icon" aria-hidden="true">📄→📝</div>
    <p id="processingText" style="font-size:1.125rem;color:var(--color-slate);">Reading your document…</p>
    <p id="processingTime" style="color:var(--color-muted);">This usually takes about 10 seconds.</p>
    <div class="progress-bar" role="progressbar" aria-label="Processing"><span></span></div>
    <p id="notStored" style="font-size:0.875rem;color:var(--color-muted);">Your data is not stored.</p>
  </div>

  <div id="resultsView" hidden>
    <header class="app-bar">
      <div class="app-bar-inner">
        <button type="button" class="back-btn" onclick="location.href='/home'" aria-label="Back">←</button>
        <span class="app-bar-title" id="resultsBarTitle">Klarify</span>
        <span class="app-bar-spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="screen screen-wide">
      <div class="page-header">
        <h1 class="screen-title" id="docTitle">Your prescription explained</h1>
        <p class="subtitle-muted" id="docSubtitle"></p>
      </div>

      <div class="results-layout">
        <section class="results-column">
          <div id="results" class="results"></div>

          <div class="feedback-row" id="feedbackRow">
            <span id="helpfulText">Was this helpful?</span>
            <button type="button" aria-label="Yes">👍</button>
            <button type="button" aria-label="No">👎</button>
          </div>
          <button type="button" class="btn-ghost block" id="saveBtn" style="margin-bottom:1rem;">Save explanation</button>
        </section>

        <aside class="results-aside">
          <div class="chat-panel" id="chatPanel" hidden>
            <h2 id="chatTitle">Ask about your prescription</h2>
            <p class="chat-sub" id="chatSub">Ask about this document or general steps (pharmacy, appointments, terms)</p>
            <div class="chat-suggestions" id="chatSuggestions">
              <button type="button" data-q="What medication was prescribed?">Medication?</button>
              <button type="button" data-q="Do I need to pay a co-payment?">Co-payment?</button>
              <button type="button" data-q="How do I use this at the pharmacy?">Pharmacy?</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
              <input type="text" id="chatInput" autocomplete="off" />
              <button type="button" id="chatSendBtn">Send</button>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <p class="disclaimer" id="disclaimer">Informational only — not medical advice.</p>
  </div>

  <script src="/static/i18n.js?v=20261120b"></script>
  <script src="/static/ui.js?v=20261120b"></script>
  <script src="/static/results.js?v=20261120b"></script>
  <script>
    if (!sessionStorage.getItem('klarify_lang')) location.href = '/';
    applyRtl();

    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'sample';
    const lang = params.get('lang') || klarifyLang();
    const mode = params.get('mode') || 'auto';

    document.getElementById('processingText').textContent = t('processing');
    document.getElementById('processingTime').textContent = t('processingTime');
    document.getElementById('notStored').textContent = t('notStored');
    document.getElementById('docTitle').textContent = t('prescriptionExplained');
    document.getElementById('helpfulText').textContent = t('helpful');
    document.getElementById('chatTitle').textContent = t('chatTitle');
    document.getElementById('chatInput').placeholder = t('chatPlaceholder');
    document.getElementById('chatSendBtn').textContent = t('send');
    document.getElementById('disclaimer').textContent = t('disclaimer');

    const processingView = document.getElementById('processingView');
    const resultsView = document.getElementById('resultsView');
    const resultsEl = document.getElementById('results');
    const chatPanel = document.getElementById('chatPanel');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const saveBtn = document.getElementById('saveBtn');
    const TITLES = {
      prescription: t('prescriptionExplained'),
      lab_result: 'Your lab results explained',
      discharge: 'Your discharge letter explained',
      referral: 'Your referral explained',
      doctor_letter: "Your doctor's letter explained",
      pdf: 'Your document explained',
    };
    const CHAT_TITLES = { prescription: t('chatTitle') };

    let prescriptionData = null;
    let chatHistory = [];
    let chatBusy = false;

    processingView.hidden = false;

    function showResults() {
      processingView.hidden = true;
      resultsView.hidden = false;
    }

    function appendChatMessage(text, role, refused = false) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + role + (refused ? ' refused' : '');
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'chat-msg bot typing';
      div.setAttribute('aria-label', 'Assistant is typing');
      div.innerHTML = '<i></i><i></i><i></i>';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    async function sendChatMessage(text) {
      const message = (text || chatInput.value).trim();
      if (!message || chatBusy || !prescriptionData) return;
      chatInput.value = '';
      appendChatMessage(message, 'user');
      chatBusy = true;
      chatSendBtn.disabled = true;
      const typing = showTyping();
      try {
        const data = await apiFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            parsed: prescriptionData.parsed,
            humanized: prescriptionData.humanized,
            history: chatHistory,
            lang,
          }),
        });
        typing.remove();
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: data.reply });
        appendChatMessage(data.reply, 'bot', !data.on_topic);
      } catch (err) {
        typing.remove();
        appendChatMessage(err.message, 'bot', true);
      } finally {
        chatBusy = false;
        chatSendBtn.disabled = false;
        chatInput.focus();
      }
    }

    async function loadData() {
      try {
        let res;
        let data;
        if (type === 'cached') {
          const cached = sessionStorage.getItem('klarify_result');
          if (!cached) throw new Error('No result found. Please upload again.');
          data = JSON.parse(cached);
          sessionStorage.removeItem('klarify_result');
        } else if (type === 'sample') {
          const id = params.get('sample_id') || params.get('id');
          if (!id) throw new Error('Missing sample ID');
          res = await fetch(`/api/process/sample/${encodeURIComponent(id)}?lang=${encodeURIComponent(lang)}&mode=${encodeURIComponent(mode)}`);
          data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Request failed');
        } else if (type === 'erp') {
          const taskId = params.get('task_id');
          const token = sessionStorage.getItem('erp_token') || '';
          const headers = token ? { Authorization: `Bearer ${token}` } : {};
          res = await fetch(`/api/erp/fetch/${encodeURIComponent(taskId)}?lang=${encodeURIComponent(lang)}&mode=${encodeURIComponent(mode)}`, { headers });
          data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Request failed');
        } else if (type === 'epa') {
          const docId = params.get('doc_id');
          const token = sessionStorage.getItem('epa_token') || 'sandbox-demo-token';
          res = await fetch(
            `/api/epa/documents/${encodeURIComponent(docId)}/process?lang=${encodeURIComponent(lang)}&mode=${encodeURIComponent(mode)}`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Request failed');
        } else if (type === 'upload' || type === 'raw') {
          const raw = sessionStorage.getItem('klarify_upload') || sessionStorage.getItem('erp_raw_payload');
          if (!raw) throw new Error('No document found. Please upload again.');
          res = await fetch('/api/process/raw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: raw,
          });
          data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Request failed');
        } else {
          throw new Error('Unknown type');
        }

        if (!data) {
          data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Request failed');
        }

        prescriptionData = data;
        const docType = data.document_type || data.parsed?.document_type || 'prescription';
        const title = TITLES[docType] || TITLES.pdf;
        document.getElementById('docTitle').textContent = title;
        document.title = `Klarify — ${title}`;
        document.getElementById('chatTitle').textContent = CHAT_TITLES[docType] || 'Ask about this document';
        const med = data.parsed?.medication_name || '';
        const sub = med || (data.document_title && data.document_title !== title ? data.document_title : '');
        if (sub) document.getElementById('docSubtitle').textContent = sub;

        renderKlarifyResults(resultsEl, data);
        chatPanel.hidden = false;
        showResults();
      } catch (err) {
        showResults();
        saveBtn.hidden = true;
        document.getElementById('feedbackRow').hidden = true;
        resultsEl.innerHTML = `<div class="empty is-error">${escapeHtml(err.message)}<br>
          <a class="btn-secondary" href="/home">Back to start</a></div>`;
      }
    }

    document.getElementById('feedbackRow').addEventListener('click', (e) => {
      if (e.target.closest('button')) {
        document.getElementById('feedbackRow').hidden = true;
        toast('Thanks for your feedback!', 'success', 2500);
      }
    });
    saveBtn.addEventListener('click', async () => {
      if (!prescriptionData) return;
      const auth = JSON.parse(sessionStorage.getItem('klarify_auth') || 'null');
      if (!auth?.token) {
        // Keep the result so the user comes back to it after logging in
        sessionStorage.setItem('klarify_result', JSON.stringify(prescriptionData));
        const back = `/results?type=cached&lang=${encodeURIComponent(lang)}`;
        window.location.href = `/account?next=${encodeURIComponent(back)}`;
        return;
      }
      setBusy(saveBtn, true);
      try {
        await apiFetch('/api/storage/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${auth.token}` },
          body: JSON.stringify({ password: auth.password, record: prescriptionData }),
        });
        setBusy(saveBtn, false);
        saveBtn.disabled = true;
        saveBtn.textContent = '✓ Saved to your timeline';
        toast('Saved to your health timeline.', 'success');
      } catch (e) {
        setBusy(saveBtn, false);
        if (e.status === 401) sessionStorage.removeItem('klarify_auth');
        toast(e.status === 401 ? 'Please log in again to save.' : e.message, 'error');
      }
    });
    chatSendBtn.addEventListener('click', () => sendChatMessage());
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendChatMessage(); }
    });
    document.getElementById('chatSuggestions').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-q]');
      if (btn) sendChatMessage(btn.dataset.q);
    });

    loadData();
  </script>
</body>
</html>
