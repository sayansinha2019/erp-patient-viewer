<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klarify — ePA</title>
  <link rel="stylesheet" href="/static/shared.css?v=20260710" />
</head>
<body class="has-app-bar">
  <header class="app-bar">
    <div class="app-bar-inner">
      <button type="button" class="back-btn" onclick="location.href='/home'" aria-label="Back">←</button>
      <span class="app-bar-title">ePA</span>
      <span class="app-bar-spacer" aria-hidden="true"></span>
    </div>
  </header>
  <main class="screen screen-wide screen-panel">
    <div class="page-header">
      <h1 class="screen-title">Connect ePA</h1>
      <p class="lead" id="epaStatus" style="margin-bottom:var(--space-6);">Checking connection…</p>
    </div>
    <button type="button" class="btn-primary" id="connectBtn" style="max-width:320px;">Connect (sandbox)</button>
    <div id="docList" style="margin-top:2rem;"></div>
  </main>
  <script src="/static/i18n.js"></script>
  <script>
    if (!sessionStorage.getItem('klarify_lang')) location.href = '/';
    applyRtl();
    let token = sessionStorage.getItem('epa_token') || 'sandbox-demo-token';

    async function init() {
      const st = await fetch('/api/epa/status').then(r => r.json());
      document.getElementById('epaStatus').textContent =
        `Mode: ${st.epa.mode} · ${st.connectivity.reachable ? 'Connected' : 'Offline (mock data available)'}`;
      if (token) loadDocs();
    }

    async function loadDocs() {
      const res = await fetch('/api/epa/documents?patient_id=demo-patient', {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      const el = document.getElementById('docList');
      el.innerHTML = '<h2 class="section-heading">Your ePA documents</h2><div class="doc-list-grid" id="docGrid"></div>';
      const grid = document.getElementById('docGrid');
      for (const d of data.documents || []) {
        const btn = document.createElement('button');
        btn.className = 'btn-secondary';
        btn.textContent = `${d.title} (${d.type})`;
        btn.onclick = () => {
          const lang = klarifyLang();
          window.location.href = `/results?type=epa&doc_id=${encodeURIComponent(d.id)}&lang=${encodeURIComponent(lang)}`;
        };
        grid.appendChild(btn);
      }
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      const data = await fetch('/api/epa/oauth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: 'sandbox-demo', redirect_uri: window.location.origin + '/epa' }),
      }).then(r => r.json());
      token = data.access_token;
      sessionStorage.setItem('epa_token', token);
      loadDocs();
    });

    init();
  </script>
</body>
</html>
