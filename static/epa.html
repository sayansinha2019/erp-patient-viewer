<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klarify — ePA</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261120b" />
</head>
<body class="has-app-bar">
  <header class="app-bar">
    <div class="app-bar-inner">
      <button type="button" class="back-btn" onclick="location.href='/home'" aria-label="Back">←</button>
      <span class="app-bar-title">ePA</span>
      <span class="app-bar-spacer" aria-hidden="true"></span>
    </div>
  </header>
  <main class="screen screen-wide screen-panel">
    <div class="page-header">
      <h1 class="screen-title">Connect ePA</h1>
      <p class="lead" id="epaStatus" style="margin-bottom:var(--space-6);">Checking connection…</p>
    </div>
    <button type="button" class="btn-primary" id="connectBtn" style="max-width:320px;">Connect (sandbox)</button>
    <div id="docList" style="margin-top:2rem;"></div>
  </main>
  <script src="/static/i18n.js?v=20261120b"></script>
  <script src="/static/ui.js?v=20261120b"></script>
  <script>
    if (!sessionStorage.getItem('klarify_lang')) location.href = '/';
    applyRtl();
    const connectBtn = document.getElementById('connectBtn');
    const docList = document.getElementById('docList');
    let token = sessionStorage.getItem('epa_token');

    async function init() {
      try {
        const st = await apiFetch('/api/epa/status');
        document.getElementById('epaStatus').textContent =
          `Mode: ${st.epa.mode} · ${st.connectivity.reachable ? 'Connected' : 'Offline (demo data available)'}`;
      } catch (e) {
        document.getElementById('epaStatus').textContent = 'Could not check the ePA connection.';
      }
      if (token) {
        connectBtn.textContent = 'Refresh documents';
        loadDocs();
      }
    }

    async function loadDocs() {
      docList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
      try {
        const data = await apiFetch('/api/epa/documents?patient_id=demo-patient', {
          headers: { Authorization: `Bearer ${token || 'sandbox-demo-token'}` },
        });
        docList.innerHTML = '<h2 class="section-heading">Your ePA documents</h2><div class="doc-list-grid" id="docGrid"></div>';
        const grid = document.getElementById('docGrid');
        for (const d of data.documents || []) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-secondary';
          btn.textContent = `${d.title} (${d.type})`;
          btn.onclick = () => {
            window.location.href = `/results?type=epa&doc_id=${encodeURIComponent(d.id)}&lang=${encodeURIComponent(klarifyLang())}`;
          };
          grid.appendChild(btn);
        }
        if (!data.documents?.length) grid.outerHTML = '<p class="subtitle-muted">No documents found in this ePA.</p>';
      } catch (e) {
        docList.innerHTML = `<div class="empty is-error">${escapeHtml(e.message)}</div>`;
      }
    }

    connectBtn.addEventListener('click', async () => {
      setBusy(connectBtn, true);
      try {
        const data = await apiFetch('/api/epa/oauth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: 'sandbox-demo', redirect_uri: window.location.origin + '/epa' }),
        });
        if (!data?.access_token) throw new Error('The ePA did not return an access token.');
        token = data.access_token;
        sessionStorage.setItem('epa_token', token);
        connectBtn.textContent = 'Refresh documents';
        toast('Connected to ePA sandbox', 'success');
        await loadDocs();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        setBusy(connectBtn, false);
      }
    });

    init();
  </script>
</body>
</html>
