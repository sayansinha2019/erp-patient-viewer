<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klarify</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261120c" />
</head>
<body class="has-app-bar">
  <header class="app-bar">
    <div class="app-bar-inner">
      <span class="app-bar-spacer" aria-hidden="true"></span>
      <a href="/home" class="wordmark-link">Klarify</a>
      <button type="button" class="back-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="screen screen-wide">
    <div class="screen-panel">
      <div class="home-hero page-header">
        <h2 class="display" id="greeting">Hello.</h2>
        <p class="lead" id="homeQuestion">Which document would you like to understand today?</p>
      </div>

      <div class="home-cards">
        <a href="/upload" class="home-card home-card--primary" id="uploadBtn">
          <span class="home-card__icon" aria-hidden="true">📄</span>
          <span class="home-card__title" id="uploadTitle">Upload document</span>
          <span class="home-card__desc">PDF, FHIR, or scanned letter</span>
        </a>
        <a href="/epa" class="home-card home-card--secondary" id="epaBtn">
          <span class="home-card__icon" aria-hidden="true">🏥</span>
          <span class="home-card__title" id="epaLabel">Connect ePA</span>
          <span class="home-card__desc">Import from your electronic health record</span>
        </a>
      </div>

      <div class="trust-strip" id="trustStrip">
        <span aria-hidden="true">🔒</span>
        <span id="trustText">Your data is deleted immediately. Nothing is stored.</span>
      </div>

      <div class="secondary-actions">
        <button type="button" class="link-pill" id="accountCta">Create account → Save your history</button>
        <button type="button" class="link-pill" id="sampleBtn">Try a sample prescription</button>
      </div>
    </div>
  </main>

  <script src="/static/i18n.js?v=20261120c"></script>
  <script src="/static/ui.js?v=20261120c"></script>
  <script>
    if (!sessionStorage.getItem('klarify_lang')) {
      window.location.href = '/';
    }
    applyRtl();
    document.getElementById('greeting').textContent = greeting();
    document.getElementById('homeQuestion').textContent = t('homeQuestion');
    document.getElementById('uploadTitle').textContent = t('uploadDoc');
    document.getElementById('epaLabel').textContent = t('connectEpa');
    document.getElementById('trustText').textContent = t('trustStrip');
    document.getElementById('accountCta').textContent = t('createAccount');
    document.getElementById('sampleBtn').textContent = t('trySample');
    document.getElementById('settingsBtn').addEventListener('click', () => { window.location.href = '/'; });
    document.getElementById('accountCta').addEventListener('click', () => {
      const a = JSON.parse(sessionStorage.getItem('klarify_auth') || 'null');
      window.location.href = a?.token ? '/timeline' : '/account';
    });
    const sampleBtn = document.getElementById('sampleBtn');
    sampleBtn.addEventListener('click', async () => {
      setBusy(sampleBtn, true);
      try {
        const data = await apiFetch('/api/samples');
        const first = (data.samples || []).find((s) => s.type === 'prescription') || (data.samples || [])[0];
        if (!first) throw new Error('No samples available right now.');
        const lang = klarifyLang();
        window.location.href = `/results?type=sample&sample_id=${encodeURIComponent(first.id)}&lang=${encodeURIComponent(lang)}&mode=auto`;
      } catch (e) {
        setBusy(sampleBtn, false);
        toast(e.message, 'error');
      }
    });
    const auth = JSON.parse(sessionStorage.getItem('klarify_auth') || 'null');
    if (auth?.token) {
      document.getElementById('accountCta').textContent = 'My health timeline →';
    }
  </script>
</body>
</html>
