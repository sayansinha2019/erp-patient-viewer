<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klarify — Account</title>
  <link rel="stylesheet" href="/static/shared.css?v=20260710" />
</head>
<body class="has-app-bar">
  <header class="app-bar">
    <div class="app-bar-inner">
      <button type="button" class="back-btn" onclick="location.href='/home'" aria-label="Back">←</button>
      <span class="app-bar-title">Account</span>
      <span class="app-bar-spacer" aria-hidden="true"></span>
    </div>
  </header>
  <main class="screen screen-narrow screen-panel">
    <div class="page-header">
      <h1 class="screen-title">Save your health history</h1>
      <p class="lead" style="margin-bottom:var(--space-6);">Optional encrypted storage — AES-256, client-side key derivation.</p>
    </div>
    <label class="form-field">Email
      <input type="email" id="email" autocomplete="email" />
    </label>
    <label class="form-field">Password
      <input type="password" id="password" autocomplete="current-password" />
    </label>
    <div class="btn-row">
      <button type="button" class="btn-primary" id="registerBtn">Create account</button>
      <button type="button" class="btn-secondary" id="loginBtn">Log in</button>
    </div>
    <button type="button" class="btn-ghost block" id="timelineBtn" style="margin-top:1rem;">View health timeline →</button>
    <p id="msg" class="subtitle-muted"></p>
  </main>
  <script>
    function saveAuth(data) {
      sessionStorage.setItem('klarify_auth', JSON.stringify({ ...data, password: password.value }));
    }

    function goToTimeline() {
      window.location.href = '/timeline';
    }

    document.getElementById('registerBtn').onclick = async () => {
      const res = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value }),
      });
      const data = await res.json();
      if (res.ok) {
        saveAuth(data);
        goToTimeline();
      } else {
        document.getElementById('msg').textContent = data.detail || 'Error';
      }
    };
    document.getElementById('loginBtn').onclick = async () => {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value }),
      });
      const data = await res.json();
      if (res.ok) {
        saveAuth(data);
        goToTimeline();
      } else {
        document.getElementById('msg').textContent = data.detail || 'Login failed';
      }
    };
    document.getElementById('timelineBtn').onclick = () => location.href = '/timeline';
    const email = document.getElementById('email');
    const password = document.getElementById('password');
  </script>
</body>
</html>
